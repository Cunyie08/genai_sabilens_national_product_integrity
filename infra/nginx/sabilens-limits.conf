# SabiLens upload limits — installed automatically by deploy.sh
#
# The scan endpoint accepts two base64-encoded images per request (front + back).
# Nginx's default 1 MB body limit rejects these requests with HTTP 413.
# This file raises the limit and matches the 120 s backend timeout.
#
# Placed in /etc/nginx/conf.d/ so it is included inside the http { } block.

client_max_body_size 20m;
proxy_read_timeout   120s;
proxy_send_timeout   120s;
