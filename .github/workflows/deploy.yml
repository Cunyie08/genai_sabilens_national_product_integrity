name: Deploy to GCE

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCE_INSTANCE: ${{ secrets.GCE_INSTANCE_NAME }}
  GCE_ZONE: ${{ secrets.GCE_ZONE }}

# ─── JOB 1: Run backend tests ─────────────────────────────────────────────────
jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sabilens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest backend/tests/ -v --tb=short -x
        env:
          TESTING: "true"
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/sabilens_test"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-test-secret-key-not-real"

# ─── JOB 2: Deploy via IAP SSH ────────────────────────────────────────────────
  deploy:
    name: Deploy to GCE via IAP
    runs-on: ubuntu-latest
    needs: [test]
    environment: production

    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticates via WIF — no JSON key, short-lived OIDC token only
      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # The SSH private key lives in Secret Manager, not GitHub Secrets
      - name: Fetch SSH deploy key from Secret Manager
        run: |
          mkdir -p ~/.ssh
          gcloud secrets versions access latest \
            --secret="sabilens-ssh-deploy-key" \
            --project="$PROJECT_ID" \
            > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # IAP proxies the TCP tunnel — port 22 is never open to the internet.
      # Raw SSH with IAP as ProxyCommand avoids pushing keys to instance metadata.
      - name: Deploy via IAP SSH Tunnel
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ProxyCommand="gcloud compute start-iap-tunnel %h 22 \
              --listen-on-stdin \
              --zone=${GCE_ZONE} \
              --project=${PROJECT_ID}" \
            deployer@"${GCE_INSTANCE}" \
            "bash /opt/sabilens/scripts/deploy.sh" 2>&1

      - name: Revoke SSH key (cleanup)
        if: always()
        run: rm -f ~/.ssh/deploy_key
